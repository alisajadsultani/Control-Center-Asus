[workspace]
resolver = "2"
members = [
    "controlcenter-gui",
    "rust-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ali Sultani"]
license = "MIT"

# Shared across every crate in the daemon so nothing drifts on the wire
# format (zbus) or error handling conventions between them.
[workspace.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_polkit = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
