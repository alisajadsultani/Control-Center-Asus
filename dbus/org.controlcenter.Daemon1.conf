<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus-level access policy for org.controlcenter.Daemon1.

  This layer only answers "can this process talk to the daemon at all";
  it's deliberately open to every local user, the same way UPower or
  NetworkManager's system services are. The finer-grained "is *this*
  caller allowed to *change* a setting" question is answered by polkit
  inside the daemon itself (see polkit/), not here.
-->
<busconfig>
  <policy user="root">
    <allow own="org.controlcenter.Daemon1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.controlcenter.Daemon1"
           send_interface="org.controlcenter.Daemon1.Battery"/>
    <allow receive_sender="org.controlcenter.Daemon1"/>
  </policy>
</busconfig>
