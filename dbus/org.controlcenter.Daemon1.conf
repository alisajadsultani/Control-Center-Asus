<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Controls who can reach org.controlcenter.Daemon1 on the system bus at
  all. Deliberately open to every local user (like UPower/NetworkManager);
  polkit (see polkit/) is what gates whether a specific caller can change
  a specific setting.
-->
<busconfig>
  <policy user="root">
    <allow own="org.controlcenter.Daemon1"/>
  </policy>

  <policy context="default">
    <!--
      Not scoped to send_interface: property reads (GetProperty/GetAll) go
      over org.freedesktop.DBus.Properties, not our interface name, so an
      interface-scoped rule would silently block them.
    -->
    <allow send_destination="org.controlcenter.Daemon1"/>
    <allow receive_sender="org.controlcenter.Daemon1"/>
  </policy>
</busconfig>
